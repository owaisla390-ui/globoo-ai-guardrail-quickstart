name: GLOBOO Deterministic Policy Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-deterministic-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Deterministic Policy & Attack Simulation
        run: python demo_attack_simulation.py
        
